<!DOCTYPE html>
<html>
<head>
<title>Bike Showrooms</title>
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #ffc0cb;
}

h2 {
    text-align: center;
    margin-top: 20px;
}
.search-box {
    text-align: side;
    margin: 20px;
}
.search-box input {
    width: 60%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    outline: none;
}
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

/* Card */
.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

/* Image */
.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
}

/* Buttons */
button {
    padding: 8px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin: 5px;
}

.buy {
    background: #ff1493;
    color: white;
}

.like {
    background: white;
    font-size: 18px;
}

/* CONTACT SECTION */
.contact {
    background: white;
    margin: 30px auto;
    width: 90%;
    max-width: 600px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.contact h3 {
    margin-bottom: 10px;
}

/* Footer */
footer {
    text-align: center;
    padding: 15px;
    background: #ff69b4;
    color: white;
    margin-top: 20px;
}

@media(max-width:600px) {
    .search-box input {
        width: 90%;
    }
}
</style>

</head>

<body>

<h2>⚡Ram Bikes Store🏍️</h2>

<div class="search-box">
    <input type="text" id="search" placeholder="Search bikes..." onkeyup="searchBike()">
</div>

<div class="container">

    <div class="card">
        <img src="DUKE.JPEG">
        <h3>Duke 390</h3>
        <p>₹3,00,000</p>
        <button class="like" onclick="like(this)">🤍</button>
        <a href="buy.html"><button class="buy">Buy</button></a>
    </div>

    <div class="card">
        <img src="HUNTER.JPEG">
        <h3>Hunter 350</h3>
        <p>₹1,70,000</p>
        <button class="like" onclick="like(this)">🤍</button>
        <a href="buy.html"><button class="buy">Buy</button></a>
    </div>

    <div class="card">
        <img src="K.JPEG">
        <h3>KTM RC 200</h3>
        <p>₹2,20,000</p>
        <button class="like" onclick="like(this)">🤍</button>
        <a href="buy.html"><button class="buy">Buy</button></a>
    </div>

    <div class="card">
        <img src="YA.JPEG">
        <h3>Yamaha R15 V4</h3>
        <p>₹1,85,000</p>
        <button class="like" onclick="like(this)">🤍</button>
        <a href="buy.html"><button class="buy">Buy</button></a>
    </div>

</div>

<!-- CONTACT DETAILS -->
<div class="contact">
    <h3>📞 Contact Details</h3>
    <p><b>Owner:</b>Ram Bike Showroom Pvt Ltd</p>
    <p><b>Phone:</b> +91 98765 43210</p>
    <p><b>Email:</b> rambikes@gmail.com</p>
    <p><b>Address:</b> salem, Tamil Nadu, India</p>
</div>

<footer>
    © 2026 Bike Showroom | All Rights Reserved
</footer>

<script>

// LIKE BUTTON
function like(btn) {
    if (btn.innerHTML === "🤍") {
        btn.innerHTML = "❤️";
    } else {
        btn.innerHTML = "🤍";
    }
}

// SEARCH FILTER
function searchBike() {
    let input = document.getElementById("search").value.toLowerCase();
    let cards = document.getElementsByClassName("card");

    for (let i = 0; i < cards.length; i++) {
        let name = cards[i].getElementsByTagName("h3")[0].innerText.toLowerCase();

        if (name.includes(input)) {
            cards[i].style.display = "block";
        } else {
            cards[i].style.display = "none";
        }
    }
}

</script>

</body>
</html>
